<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }

        #reservaForm {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        #reservaForm label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        #reservaForm input {
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: normal;
        }

        #reservaForm button {
            margin-top: 8px;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #25D366;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #reservaForm button:hover {
            background: #1ebe5b;
        }
    </style>
</head>
<body>
    <h1>Hola </h1>
    <H2>esto es una página de reservas</H2>

    <form id="reservaForm">
        <label for="nombre">Nombre
            <input type="text" id="nombre" placeholder="Tu nombre" required>
        </label>
        <label for="fecha">Día
            <input type="date" id="fecha" required>
        </label>
        <label for="hora">Hora aproximada
            <input type="time" id="hora" required>
        </label>
        <label for="adultos">Nº de adultos
            <input type="number" id="adultos" min="1" value="1" required>
        </label>
        <label for="ninos">Nº de niños
            <input type="number" id="ninos" min="0" value="0" required>
        </label>
        <button type="submit">Reservar por WhatsApp</button>
    </form>

    <script>
    document.getElementById('reservaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const fecha = document.getElementById('fecha').value;
        const hora = document.getElementById('hora').value;
        const adultos = document.getElementById('adultos').value;
        const ninos = document.getElementById('ninos').value;

        let mensaje = `Hola, quiero hacer una reserva a nombre de ${nombre} para el día ${fecha} a las ${hora}. Somos ${adultos} adulto(s)`;
        if (parseInt(ninos, 10) > 0) {
            mensaje += ` y ${ninos} niño(s)`;
        }
        mensaje += '.';

        const url = `https://wa.me/34618381418?text=${encodeURIComponent(mensaje)}`;

        window.open(url, '_blank');
    });
    </script>
</body>
</html>
